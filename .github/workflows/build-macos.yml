name: Build macOS distribution

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runners are Apple Silicon (arm64); macos-15-intel
          # runners are Intel (x86_64). PyInstaller does not cross-compile,
          # so each architecture needs its own native runner -- see README's
          # macOS Architectures section for what this matrix actually
          # validates.
          #
          # Originally macos-14 / macos-13: macos-13 was fully retired by
          # GitHub in December 2025 (confirmed: the x86_64 job for this
          # matrix leg sat "queued" indefinitely, never picked up by any
          # runner, because the image no longer exists), and macos-14
          # entered its own deprecation window in July 2026 (fully
          # unsupported by November 2026). macos-15-intel is GitHub's
          # documented migration target for Intel workloads; GitHub has said
          # it will drop x86_64 macOS support entirely after macos-15 retires
          # (targeted Fall 2027), so there is no longer-lived Intel label to
          # move to beyond this one.
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # No secrets, no real textbook/exam-paper PDFs, no API key -- the
      # suite is fully offline (see README's Testing section).
      #
      # DOCLING_DEVICE=cpu: the macos-14 (arm64) runner's virtualized GPU has
      # no real Metal memory behind it, so torch's MPS backend hard-fails
      # even a 3.5 KiB allocation while loading docling's layout model ("MPS
      # backend out of memory ... allocated: 0 bytes") -- confirmed directly
      # from this exact CI run's failure log, and confirmed that raising
      # PYTORCH_MPS_HIGH_WATERMARK_RATIO doesn't help, since the allocation
      # itself fails, not just a soft policy ceiling. docling reads
      # DOCLING_DEVICE natively (see AcceleratorOptions in
      # docling.datamodel.accelerator_options) to pick its inference device,
      # so this needs no change to this project's own pipeline code. Scoped
      # to this CI step only -- not shipped in the packaged app, so real
      # users on real Apple Silicon hardware still get MPS acceleration.
      - name: Run test suite
        env:
          DOCLING_DEVICE: cpu
        run: pytest -q

      - name: Regenerate app icon
        run: python scripts/build_icon.py

      - name: Build application and DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPaperAnalyzer-macos-${{ matrix.arch }}
          path: dist/ExamPaperAnalyzer.dmg
          if-no-files-found: error

  release:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ExamPaperAnalyzer-macos-*
          path: artifacts
      - name: Rename per-architecture DMGs
        run: |
          mv artifacts/ExamPaperAnalyzer-macos-arm64/ExamPaperAnalyzer.dmg artifacts/ExamPaperAnalyzer-arm64.dmg
          mv artifacts/ExamPaperAnalyzer-macos-x86_64/ExamPaperAnalyzer.dmg artifacts/ExamPaperAnalyzer-x86_64.dmg
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ExamPaperAnalyzer-arm64.dmg
            artifacts/ExamPaperAnalyzer-x86_64.dmg
          draft: true
