name: Build macOS distribution

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-macos:
    # Apple Silicon (arm64) only -- x86_64 (Intel) macOS is not buildable
    # with this project's current dependencies. Confirmed directly: `pip
    # install -r requirements.txt` fails on macos-15-intel with "Could not
    # find a version that satisfies the requirement torch<3.0.0,>=2.2.2 ...
    # (from versions: none)". PyTorch stopped publishing macOS x86_64 wheels
    # after 2.2.2 (deprecated since January 2024), and 2.2.2 itself predates
    # Python 3.14 (no cp314 build exists for it on any platform), so there is
    # no torch version that satisfies both "Python 3.14" and "Intel macOS"
    # simultaneously -- not a CI configuration problem, an upstream one. See
    # README's macOS Architectures section.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # No secrets, no real textbook/exam-paper PDFs, no API key -- the
      # suite is fully offline (see README's Testing section).
      #
      # DOCLING_DEVICE=cpu: this runner's virtualized GPU has no real Metal
      # memory behind it, so torch's MPS backend hard-fails even a 3.5 KiB
      # allocation while loading docling's layout model ("MPS backend out of
      # memory ... allocated: 0 bytes") -- confirmed directly from this exact
      # CI run's failure log, and confirmed that raising
      # PYTORCH_MPS_HIGH_WATERMARK_RATIO doesn't help, since the allocation
      # itself fails, not just a soft policy ceiling. docling reads
      # DOCLING_DEVICE natively (see AcceleratorOptions in
      # docling.datamodel.accelerator_options) to pick its inference device,
      # so this needs no change to this project's own pipeline code. Scoped
      # to this CI step only -- not shipped in the packaged app, so real
      # users on real Apple Silicon hardware still get MPS acceleration.
      - name: Run test suite
        env:
          DOCLING_DEVICE: cpu
        run: pytest -q

      - name: Regenerate app icon
        run: python scripts/build_icon.py

      - name: Build application and DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPaperAnalyzer-macos-arm64
          path: dist/ExamPaperAnalyzer.dmg
          if-no-files-found: error

  release:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExamPaperAnalyzer-macos-arm64
          path: artifacts
      - name: Rename DMG
        run: mv artifacts/ExamPaperAnalyzer.dmg artifacts/ExamPaperAnalyzer-macOS-arm64.dmg
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/ExamPaperAnalyzer-macOS-arm64.dmg
          draft: true
