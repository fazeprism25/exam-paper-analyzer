name: Build Windows installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # windows-latest has MSVC installed but not on PATH by default outside
      # a Developer Command Prompt. torch._inductor (invoked transitively by
      # docling/RapidOCR's model inference, not by this project's own code)
      # JIT-compiles a small C++ kernel on first use and fails with
      # "InvalidCxxCompiler: Compiler: cl is not found" without this --
      # confirmed directly on this runner image, not a packaging issue.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # No secrets, no real textbook/exam-paper PDFs, no API key -- the
      # suite is fully offline (see README's Testing section).
      - name: Run test suite
        run: pytest -q

      - name: Regenerate app icon
        run: python scripts/build_icon.py

      - name: Build application (PyInstaller)
        run: pyinstaller packaging/exampapersorter.spec --noconfirm --distpath dist --workpath build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamPaperAnalyzer-Setup-windows
          path: dist/installer/ExamPaperAnalyzer-Windows-Setup.exe
          if-no-files-found: error

      - name: Upload unpacked app (debugging aid)
        uses: actions/upload-artifact@v4
        with:
          name: ExamPaperAnalyzer-windows-onedir
          path: dist/ExamPaperAnalyzer/
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ExamPaperAnalyzer-Setup-windows
          path: artifact
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/ExamPaperAnalyzer-Windows-Setup.exe
          draft: true
